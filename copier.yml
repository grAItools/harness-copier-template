# Copier template: AI coding agent harness (Proposal A)
#
# Renders an agent-agnostic, AGENTS.md-rooted repository harness with a thin
# Claude Code + OpenCode overlay enabled by default. GitHub Copilot code
# review and the PR template are opt-in/out via the questions below.
#
# Usage:
#   Greenfield: copier copy gh:your-org/harness-copier-template ./my-new-repo
#   Brownfield: cd existing-repo && copier copy gh:your-org/harness-copier-template .
#   Update:     cd repo && copier update
#
# Brown-field safety: README.md, Makefile, justfile, .gitignore,
# .github/PULL_REQUEST_TEMPLATE.md, development/adr/README.md (it accumulates
# decision-register rows downstream), and the populated development/ files
# (architecture, style, testing, tool-bootstrap, harness-usage, glossary) are
# protected via _skip_if_exists. Copier leaves the existing file in place and you
# can diff/merge the template version manually if needed. docs/ is never
# generated: it stays reserved for the project's own user documentation.

# ---------------------------------------------------------------------------
# Copier engine settings
# ---------------------------------------------------------------------------
_min_copier_version: "9.4.0"
_templates_suffix: ".jinja"
_subdirectory: "template"
_answers_file: ".copier-answers.yml"

# Sensitive files that must never be silently overwritten in brown-field repos.
# Copier compares the destination against this list; if a path matches and the
# file already exists at the destination, it is skipped entirely (no prompt).
_skip_if_exists:
  - "README.md"
  - "Makefile"
  - "justfile"
  - ".gitignore"
  - ".github/PULL_REQUEST_TEMPLATE.md"
  - "development/adr/README.md"
  - "development/glossary.md"
  - "development/architecture.md"
  - "development/style.md"
  - "development/testing.md"
  - "development/tool-bootstrap.md"
  - "development/harness-usage.md"

# Optional post-generation tasks. The brown-field merger hook (see hooks/) runs
# unconditionally and appends gitignore entries idempotently when an existing
# .gitignore was preserved.
_tasks:
  - "python {{ _copier_conf.src_path }}/hooks/post_gen.py"

# Files we never want copied to the destination
_exclude:
  - "copier.yml"
  - "copier.yaml"
  - ".copier-template"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - "README.template.md"
  # Note: _macros.jinja lives at the repo root (outside _subdirectory),
  # so it's never rendered to output regardless of _exclude. It is
  # imported by templates via `{% from '_macros.jinja' import ... %}`
  # — do NOT add it to _exclude, in case some Copier version/tooling
  # applies exclusion to the Jinja loader context and breaks imports.

# ---------------------------------------------------------------------------
# Questions (minimum set)
# ---------------------------------------------------------------------------

project_name:
  type: str
  help: "Human-readable project name (e.g. 'Acme Billing Service')"
  placeholder: "My Project"
  validator: >-
    {% if not project_name %}Project name cannot be empty.{% endif %}

project_description:
  type: str
  help: "One-sentence description of the project"
  placeholder: "A service that does X for Y."

primary_language:
  type: str
  help: "Primary programming language (drives sensible defaults for commands)"
  default: python
  choices:
    - python
    - typescript
    - javascript
    - rust
    - go
    - java
    - csharp
    - cpp
    - fortran
    - julia
    - other

package_manager:
  type: str
  help: |
    Package / build manager. The harness ships first-class support for a
    curated set: `uv` (Python), `pixi` (conda-ecosystem), `cmake` (C/C++).
    Pick `other` for anything else and fill in the install steps in
    `development/tool-bootstrap.md` after generation. Language/runtime version
    managers (`mise`, `asdf`) are documented separately in
    `development/tool-bootstrap.md` under "Activate the language toolchain".
  default: >-
    {%- if primary_language == 'python' -%}uv
    {%- elif primary_language == 'cpp' -%}cmake
    {%- else -%}other
    {%- endif -%}
  choices:
    - uv
    - pixi
    - cmake
    - other

test_command:
  type: str
  help: "Command that runs the fast test suite (wired into the task runner's 'test' target, or surfaced directly to agents when task_runner=none)"
  default: >-
    {%- if primary_language == 'python' and package_manager == 'uv' -%}uv run pytest -q
    {%- elif primary_language == 'python' and package_manager == 'pixi' -%}pixi run test
    {%- elif primary_language == 'cpp' and package_manager == 'cmake' -%}ctest --output-on-failure
    {%- else -%}echo 'TODO: configure test_command in copier.yml'
    {%- endif -%}
  validator: >-
    {%- if '\n' in test_command or '\r' in test_command -%}
    test_command must be a single line — embedded newlines would break
    the generated Makefile/justfile recipe syntax. Use a shell wrapper
    or a script instead.
    {%- endif -%}

lint_command:
  type: str
  help: "Command that runs static checks (wired into the task runner's 'lint' target, or surfaced directly to agents when task_runner=none)"
  default: >-
    {%- if primary_language == 'python' and package_manager == 'uv' -%}uv run ruff check .
    {%- elif primary_language == 'python' and package_manager == 'pixi' -%}pixi run lint
    {%- elif primary_language == 'cpp' and package_manager == 'cmake' -%}cmake --build build --target lint
    {%- else -%}echo 'TODO: configure lint_command in copier.yml'
    {%- endif -%}
  validator: >-
    {%- if '\n' in lint_command or '\r' in lint_command -%}
    lint_command must be a single line — embedded newlines would break
    the generated Makefile/justfile recipe syntax. Use a shell wrapper
    or a script instead.
    {%- endif -%}

fmt_command:
  type: str
  help: "Command that auto-formats code (wired into the task runner's 'fmt' target, or surfaced directly to agents when task_runner=none)"
  default: >-
    {%- if primary_language == 'python' and package_manager == 'uv' -%}uv run ruff format .
    {%- elif primary_language == 'python' and package_manager == 'pixi' -%}pixi run fmt
    {%- elif primary_language == 'cpp' and package_manager == 'cmake' -%}cmake --build build --target format
    {%- else -%}echo 'TODO: configure fmt_command in copier.yml'
    {%- endif -%}
  validator: >-
    {%- if '\n' in fmt_command or '\r' in fmt_command -%}
    fmt_command must be a single line — embedded newlines would break
    the generated Makefile/justfile recipe syntax. Use a shell wrapper
    or a script instead.
    {%- endif -%}

task_runner:
  type: str
  help: |
    How to wire dev tasks (test/lint/fmt/verify) for agents and humans:
      - make: generate a Makefile. Universal, no extra install.
      - just: generate a justfile (https://just.systems). Nicer syntax,
              no tab-sensitivity; requires `just` on PATH.
      - none: generate neither. Use this when your package manager already
              provides task management (pixi tasks, hatch scripts, pnpm
              scripts, cargo aliases, etc.). Agent docs will reference the
              raw test/lint/fmt/verify commands directly.
  default: make
  choices:
    - make
    - just
    - none

verify_command:
  type: str
  help: |
    Underlying verification gate. The exact role of this value depends on
    task_runner:
      - task_runner=make/just: this is what the generated 'verify' recipe
        shells out to. The Claude Code Stop hook invokes 'make verify' or
        'just verify' (so the runner wiring is exercised), and the recipe
        in turn calls verify_command.
      - task_runner=none: there is no recipe layer; the Stop hook and the
        '/verify' slash command invoke verify_command directly.
    Default is './scripts/verify.sh' (the canonical lint+test runner).
    The scripts/ folder (verify.sh, the canonical gate, plus fmt-file.sh,
    the per-file formatter slot the format hooks discover) is generated
    exactly when this answer mentions 'scripts/verify.sh'; point the
    answer at a project-native pipeline (e.g. 'pixi run verify' or
    'hatch run verify') and no scripts/ is generated.
  default: "./scripts/verify.sh"
  validator: >-
    {%- if not verify_command.strip() -%}
    verify_command cannot be empty — it is used as the Stop-hook command
    and the default verify target. Set it to your verification gate
    (e.g. './scripts/verify.sh' or 'pixi run verify').
    {%- elif '\n' in verify_command or '\r' in verify_command -%}
    verify_command must be a single line — embedded newlines would let
    a multi-line value split into multiple shell commands inside the
    Stop hook. Use a shell wrapper or put the multi-step logic in
    scripts/verify.sh instead.
    {%- endif -%}

# Derived, never asked (`when: false`): scripts/ ships exactly when the
# verify gate lives there. A substring test, not equality, so spellings
# like 'bash ./scripts/verify.sh' or './scripts/verify.sh --fast' still
# generate the scripts they point at. Stated once here; template files
# and the two gated file names reference `generate_scripts` (a Jinja
# path segment cannot hold the substring test itself — '/' would split
# the file name).
generate_scripts:
  type: bool
  when: false
  default: "{{ 'scripts/verify.sh' in verify_command }}"

# ---------------------------------------------------------------------------
# Workflow conventions
# ---------------------------------------------------------------------------

commit_convention:
  type: str
  help: |
    Commit-message convention surfaced to agents and humans. The full
    format, type list, examples, and merge-strategy detail live in
    `development/style.md#commit-messages`; `AGENTS.md` carries only a short
    one-line orientation that links there. `development/style.md` is
    `_skip_if_exists`, so on brownfield `copier update` an existing
    style guide is preserved — merge the template section by hand if
    you want the AGENTS.md link to resolve to one.
      - conventional: Conventional Commits 1.0.0
                      (https://www.conventionalcommits.org/en/v1.0.0/).
                      Required if your release tooling parses commit
                      messages (semantic-release, release-please,
                      changesets, ...).
      - freeform:     imperative mood, ≤72-char first line, no trailing
                      period (the historic harness default).
    Where the convention applies depends on the repo's merge strategy
    (squash-merge → the PR title; merge/rebase → every branch commit);
    the generated `development/style.md` explains the split.
  default: conventional
  choices:
    - conventional
    - freeform

# ---------------------------------------------------------------------------
# Optional modules (gated; everything off-by-default except Claude + OpenCode)
# ---------------------------------------------------------------------------

copilot_code_review:
  type: bool
  help: |
    Generate GitHub Copilot code-review configuration under `.github/`?
    Writes a populated `.github/copilot-instructions.md` (review rules,
    not a redirect), a `.github/instructions/` directory with path-scoped
    `language.instructions.md` and `security.instructions.md` files, and
    a Copilot agent skill at `.github/skills/code-review/SKILL.md`.
    Copilot code review reads these from the PR's base branch, capped at
    4,000 characters per file; it does NOT read `AGENTS.md`, so the
    review-relevant rules have to live here directly.
  default: false

pr_template:
  type: bool
  help: |
    Generate `.github/PULL_REQUEST_TEMPLATE.md`? A definition-of-done
    checklist tied to the harness: gate green, success criteria evidenced,
    `report.md` written with deviations declared, no weakened tests, and
    every `DECISION-PENDING:` line registered. Inert for non-GitHub
    remotes. Independent of copilot_code_review.
  default: true

include_claude_hooks:
  type: bool
  help: |
    Include Claude Code hooks in .claude/settings.json (auto-format on
    edit, block destructive bash, run the verify gate on Stop)? The
    Stop hook invokes the user-facing runner command — `make verify` /
    `just verify` for task_runner=make/just, or verify_command directly
    when task_runner=none — so the generated runner wiring is part of
    the agent loop. Requires `jq` on PATH.
  default: true

# ---------------------------------------------------------------------------
# Post-generation message — note answer combinations worth knowing about.
# ---------------------------------------------------------------------------
_message_after_copy: |
  {% if task_runner == 'none' -%}
  Note: task_runner=none — no Makefile or justfile was generated. Agents
  will invoke the raw commands (test_command, lint_command, fmt_command,
  verify_command) directly. The generated .claude/settings.json and
  .opencode/opencode.jsonc allow each of those four commands exactly so
  the agent loop runs without prompts. To also allow related commands
  (e.g. other pixi/hatch tasks), add a broader wildcard entry to both
  config files manually.
  {%- endif %}
